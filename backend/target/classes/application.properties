# Server
server.port=8080
spring.application.name=olive

# Database (PostgreSQL)
spring.datasource.url={SPRING_DATASOURCE_URL}
spring.datasource.username={SPRING_DATASOURCE_USERNAME}
spring.datasource.password={SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret={APP_JWT_SECRET}
app.jwt.expiration-ms={APP_JWT_EXPIRATION_MS}

# CORS - comma-separated list of allowed origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://localhost}

# Fuel low-stock threshold
app.fuel.low-stock-threshold=500

# ========================
# ACTUATOR & OBSERVABILITY
# ========================
management.endpoints.web.exposure.include=health,info,prometheus,metrics,loggers
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# ========================
# OBSERVABILITY (auto-configured by Spring Boot Docker Compose)
# ========================
# Traces: auto-configured to tempo:4318 (if tempo service found in docker-compose.yml)
management.tracing.sampling.probability=0.5

# Metrics: auto-configured to prometheus:9090 (if prometheus service found in docker-compose.yml)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.90,0.95,0.99
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.root=WARN
logging.level.com.olivepro=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

